<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 40 40"
  shape-rendering="geometricPrecision"
>
  <!-- Same rounded blue container as the Sidebar logo -->
  <rect
    width="40"
    height="40"
    rx="10"
    fill="#2563eb"
  />

  <!-- Same cropped top-right circle -->
  <circle
    cx="40"
    cy="0"
    r="14"
    fill="#3b82f6"
  />

  <!-- Three ascending bars -->
  <rect
    x="11"
    y="25"
    width="6"
    height="10"
    rx="2"
    fill="#ffffff"
  />

  <rect
    x="19"
    y="19"
    width="6"
    height="16"
    rx="2"
    fill="#ffffff"
  />

  <rect
    x="27"
    y="13"
    width="6"
    height="22"
    rx="2"
    fill="#ffffff"
  />
</svg>